# Privacy-Aware Memory Vault (Két sắt bảo mật)
# LƯU Ý: Các value thực tế phải được mã hóa nếu lưu trên Cloud. Dưới đây là metadata cho local.

sensitive_chunks:
  - hash: "api_key_weather"
    type: "API_KEY"
    context: "OpenWeatherMap cho project QUIZVLU"
    access_level: "project:quizvlu_only"
    auto_redact_in_logs: true
    sharing_policy: "NEVER_SHARE_IN_CODE_COMMENTS"

  - hash: "personal_connection"
    type: "PERSONAL_CONTEXT"
    content: "[REDACTED_SYNOPSYS_INFO]"
    access_level: "user-global-internal"
    sharing_policy: "DO_NOT_EXPOSE_IN_PUBLIC_README"

# Rule: Trước khi chạy `git commit` hoặc sinh file Markdown báo cáo, Agent phải đối chiếu text sinh ra với bảng Vault này. Nếu dính từ khóa, phải che bằng dấu ***.
